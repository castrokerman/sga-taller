# SGA Taller
#
# Arranca el sistema completo: base de datos, API y proxy HTTPS con la web.
#
#   1. Copia .env.example como .env y cambia las contraseñas.
#   2. docker compose up --build -d
#   3. Abre https://localhost en el navegador.
#
# Los datos viven en volúmenes de Docker y sobreviven a reinicios y actualizaciones.

name: sga-taller

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sga}
      POSTGRES_USER: ${POSTGRES_USER:-sga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el fichero .env}
      TZ: Europe/Madrid
    volumes:
      - sga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sga}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el fichero .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Europe/Madrid
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: infra/proxy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - sga_caddy_data:/data
      - sga_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  sga_pgdata:
  sga_caddy_data:
  sga_caddy_config:
