# SGA Taller · Fase 1 (parcial)
#
# De momento arranca la base de datos y aplica las migraciones.
# La API, la web y el proxy HTTPS se añadirán a este mismo fichero
# en los siguientes pasos de la Fase 1.
#
# Uso:  docker compose up --build

name: sga-taller

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sga}
      POSTGRES_USER: ${POSTGRES_USER:-sga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el fichero .env}
      TZ: Europe/Madrid
    volumes:
      - sga_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./apps/api
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sga}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sga}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  sga_pgdata:
